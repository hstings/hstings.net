<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>collecting · hstings</title>
  <meta name="description" content="My Pokémon card collection and writing about Pokémon sets.">
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>
  <main class="top">
    <section>
      <p data-animate><a href="../index.html">⏎ Return</a></p>
      <h1 data-animate>Collecting</h1>
      <p data-animate>
        I collect Pokémon cards. Here are a few of my favorites that I own.
      </p>
    </section>

    <section>
      <h2 data-animate>Collection</h2>

      <!--
        To add a card: copy one <figure> block, drop the image in assets/img/cards/,
        and put an <img> inside .thumb, like:
        <div class="thumb"><img src="../assets/img/cards/charizard.jpg" alt="Charizard, Base Set"></div>
        Set icons: save a small square image (PNG or SVG) in assets/img/sets/ and point the
        .set-icon <img> in the caption at it, e.g. src="../assets/img/sets/base-set.png".
        The six below are placeholders; replace them with your own.
      -->
      <div class="grid">
        <figure class="card" data-reveal>
          <div class="thumb"><img src="../assets/img/cards/en_US-BW6-119-ho_oh_ex.jpg" alt="Ho-Oh EX, Dragons Exalted"></div>
          <figcaption><strong>Ho-Oh EX</strong><img class="set-icon" src="../assets/img/sets/dragons_exalted.png" title="Dragons Exalted">119/124</figcaption>
        </figure>
        <figure class="card" data-reveal>
          <div class="thumb"><img src="../assets/img/cards/en_US-Promo_HGSS-HGSS15-shuckle.jpg" alt="Shuckle, HeartGold SoulSilver Promo"></div>
          <figcaption><strong>Shuckle</strong><img class="set-icon" src="../assets/img/sets/promo.png" title="HeartGold SoulSilver Promo">HGSS15</figcaption>
        </figure>
        <figure class="card" data-reveal>
          <div class="thumb"></div>
          <figcaption><strong>Card name</strong><img class="set-icon" src="../assets/img/sets/placeholder.svg" alt="">Set name, 003/165</figcaption>
        </figure>
        <figure class="card" data-reveal>
          <div class="thumb"></div>
          <figcaption><strong>Card name</strong><img class="set-icon" src="../assets/img/sets/placeholder.svg" alt="">Set name, 004/165</figcaption>
        </figure>
        <figure class="card" data-reveal>
          <div class="thumb"></div>
          <figcaption><strong>Card name</strong><img class="set-icon" src="../assets/img/sets/placeholder.svg" alt="">Set name, 005/165</figcaption>
        </figure>
        <figure class="card" data-reveal>
          <div class="thumb"></div>
          <figcaption><strong>Card name</strong><img class="set-icon" src="../assets/img/sets/placeholder.svg" alt="">Set name, 006/165</figcaption>
        </figure>
      </div>
    </section>

    <section>
      <h2 data-animate>Articles</h2>
      <ul class="list">
        <li data-animate>
          <img class="set-icon" src="../assets/img/sets/1ed.png" alt="" data-unit><a href="articles/base-set.html">Base Set</a><br>
          Where the English-language card game really begins.
        </li>
      </ul>
    </section>
  </main>

  <script src="../assets/js/site.js"></script>
</body>
</html>
